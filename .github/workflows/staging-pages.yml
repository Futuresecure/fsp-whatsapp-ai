name: FSP Connect 2.1 Staging Web (GitHub Pages)

on:
  push:
    branches: [dev]
    paths:
      - 'staging-web/**'
      - '.github/workflows/staging-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fsp-connect-staging-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
      - name: Configure Pages (requires Settings → Pages → GitHub Actions)
        uses: actions/configure-pages@v5
      - name: Upload only the staging frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: staging-web
      - name: Deploy the staging website
        id: deployment
        uses: actions/deploy-pages@v4