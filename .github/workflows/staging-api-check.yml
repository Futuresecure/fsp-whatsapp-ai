name: FSP Connect 2.1 Staging API Verification

on:
  push:
    branches: [dev]
    paths:
      - 'tests/staging-routes.test.mjs'
      - 'tests/stage-b-persistent-login.test.mjs'
      - 'tests/stage-p1-inbox.test.mjs'
      - 'tests/stage-p1-conversation-query.test.mjs'
      - 'scripts/history-security-audit.mjs'
      - 'tests/stage-p1-reply-readiness.test.mjs'
      - 'tests/security-audit.test.mjs'
      - 'tests/staging-api.test.mjs'
      - 'scripts/security-audit.mjs'
      - 'staging-web/style.css'
      - 'tests/stage-b-auto-read.test.mjs'
      - 'tests/stage-b-auto-read-ui.test.mjs'
      - 'tests/stage-b3-meta-connection.test.mjs'
      - 'staging-web/app.js'
      - 'supabase/functions/fsp-connect-staging-api/**'
      - '.github/workflows/staging-api-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test production route normalizer
        run: node --test tests/staging-routes.test.mjs
      - name: Test Meta connection diagnostics without credentials
        run: node --test tests/stage-b3-meta-connection.test.mjs
      - name: Test guarded Inbox automatic mark-as-read
        run: node --test tests/stage-b-auto-read.test.mjs
      - name: Test Inbox opening in browser-like simulation
        run: node --test tests/stage-b-auto-read-ui.test.mjs
      - name: Test remembered login and logout across browser restarts
        run: node --test tests/stage-b-persistent-login.test.mjs
      - name: Test Priority 1 inbox search, polling and read-only production readiness
        run: node --test tests/stage-p1-inbox.test.mjs tests/stage-p1-reply-readiness.test.mjs
      - name: Test secret scanner and scan tracked repository source
        run: |
          node --test tests/security-audit.test.mjs
          node scripts/security-audit.mjs
      - name: Test secured database-wide conversation search
        run: node --test tests/stage-p1-conversation-query.test.mjs
      - name: Scan reachable historical Git blobs for leaked credentials
        run: node scripts/history-security-audit.mjs
      - name: Check browser JavaScript syntax
        run: node --check staging-web/app.js
      - name: Verify staging API liveness (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          CODE=$(curl -sS --max-time 20 -o /tmp/fsp-health.json -w '%{http_code}' "$URL?route=%2Fhealthz")
          test "$CODE" = "200"
          grep -q '"messaging":"disabled"' /tmp/fsp-health.json
      - name: Verify approved dashboard CORS origin (no wildcard)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          curl -sSI --max-time 20 -X OPTIONS -H 'Origin: https://futuresecureproviders.com' -H 'Access-Control-Request-Method: POST' "$URL?route=%2Fapi%2Fme" > /tmp/fsp-cors.txt
          grep -qi '^access-control-allow-origin: https://futuresecureproviders.com' /tmp/fsp-cors.txt
          if grep -q '^access-control-allow-origin: \*' /tmp/fsp-cors.txt; then exit 1; fi
      - name: Verify protected route rejects unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          CODE=$(curl -sS --max-time 20 -o /tmp/fsp-unauth.json -w '%{http_code}' "$URL?route=%2Fapi%2Fme")
          test "$CODE" = "401"
          grep -q '"error":"Authentication required"' /tmp/fsp-unauth.json
      - name: Verify Meta connection check rejects unauthenticated calls
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          CODE=$(curl -sS --max-time 20 -o /tmp/fsp-no-auth-meta.json -w '%{http_code}' "$URL?route=%2Fapi%2Fmeta%2Fconnection-check")
          test "$CODE" = "401"
          grep -q '"error":"Authentication required"' /tmp/fsp-no-auth-meta.json
      - name: Verify auto-mark route rejects unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          CODE=$(curl -sS --max-time 20 -o /tmp/fsp-no-auth-auto-read.json -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"action":"auto_mark_read","observed_last_message_at":"2026-10-29T13:55:00Z","observed_unread_count":1}' "$URL?route=%2Fapi%2Fconversations%2Faaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa%2Factions")
          test "$CODE" = "401"
          grep -q '"error":"Authentication required"' /tmp/fsp-no-auth-auto-read.json
