name: FSP Connect 2.1 Staging API Verification

on:
  push:
    branches: [dev]
    paths:
      - 'tests/staging-routes.test.mjs'
      - 'tests/stage-b-persistent-login.test.mjs'
      - 'tests/stage-p1-inbox.test.mjs'
      - 'tests/stage3-reply-admission.test.mjs'
      - 'tests/stage4-ops-monitor.test.mjs'
      - 'tests/stage5-production-gates.test.mjs'
      - 'tests/stage6-operator-matrix.test.mjs'
      - 'tests/stage6-recovery.test.mjs'
      - 'tests/stage6-operator-coverage.test.mjs'
      - 'tests/stage7-privacy-incident.test.mjs'
      - 'tests/stage8-contact-management.test.mjs'
      - 'tests/stage8-analytics.test.mjs'
      - 'tests/stage8-meta-templates.test.mjs'
      - 'supabase/migrations/20261030075354_stage8_secure_analytics_summary.sql'
      - 'supabase/migrations/20261030074611_stage8_contact_explicit_consent_audit.sql'
      - 'supabase/migrations/20261030065915_stage7_readonly_retention_inventory.sql'
      - 'supabase/migrations/20261030063553_stage6_monitoring_explicit_deny_client_rls.sql'
      - 'supabase/migrations/20261030063844_stage6_read_only_recovery_integrity_preflight.sql'
      - 'supabase/migrations/20261030060606_stage4_private_operational_monitor.sql'
      - 'tests/stage-p1-conversation-query.test.mjs'
      - 'tests/stage-p1-pagination.test.mjs'
      - 'scripts/history-security-audit.mjs'
      - 'tests/stage-p1-reply-readiness.test.mjs'
      - 'tests/security-audit.test.mjs'
      - 'tests/staging-api.test.mjs'
      - 'scripts/security-audit.mjs'
      - 'staging-web/style.css'
      - 'tests/stage-b-auto-read.test.mjs'
      - 'tests/stage-b-auto-read-ui.test.mjs'
      - 'tests/stage-b3-meta-connection.test.mjs'
      - 'staging-web/app.js'
      - 'supabase/functions/fsp-connect-staging-api/**'
      - '.github/workflows/staging-api-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test production route normalizer
        run: node --test tests/staging-routes.test.mjs
      - name: Test Meta connection diagnostics without credentials
        run: node --test tests/stage-b3-meta-connection.test.mjs
      - name: Test guarded Inbox automatic mark-as-read
        run: node --test tests/stage-b-auto-read.test.mjs
      - name: Test Inbox opening in browser-like simulation
        run: node --test tests/stage-b-auto-read-ui.test.mjs
      - name: Test remembered login and logout across browser restarts
        run: node --test tests/stage-b-persistent-login.test.mjs
      - name: Test Priority 1 inbox search, polling and read-only production readiness
        run: node --test tests/stage-p1-inbox.test.mjs tests/stage-p1-reply-readiness.test.mjs
      - name: Test Stage 3 reply rate admission and safety
        run: node --test tests/stage-b2-reply.test.mjs tests/stage3-reply-admission.test.mjs
      - name: Test secret scanner and scan tracked repository source
        run: |
          node --test tests/security-audit.test.mjs
          node scripts/security-audit.mjs
      - name: Test secured database-wide conversation search
        run: node --test tests/stage-p1-conversation-query.test.mjs
      - name: Test remote Inbox pagination and query cancellation
        run: node --test tests/stage-p1-pagination.test.mjs
      - name: Scan reachable historical Git blobs for leaked credentials
        run: node scripts/history-security-audit.mjs
      - name: Test Stage 4 operational monitor privacy and freshness
        run: node --test tests/stage4-ops-monitor.test.mjs
      - name: Verify Stage 5 production release checks cannot enable customer sending
        run: node --test tests/stage5-production-gates.test.mjs
      - name: Test Stage 6 operator roles, coverage and recovery preflight
        run: node --test tests/stage6-operator-matrix.test.mjs tests/stage6-recovery.test.mjs tests/stage6-operator-coverage.test.mjs
      - name: Verify Stage 7 privacy, retention and incident response safety
        run: node --test tests/stage7-privacy-incident.test.mjs
      - name: Test Stage 8 safe contact import and explicit consent controls
        run: node --test tests/stage8-contact-management.test.mjs
      - name: Test privacy-safe Analytics summaries and current provider statuses
        run: node --test tests/stage8-analytics.test.mjs
      - name: Test read-only Meta template inventory and real approval statuses
        run: node --test tests/stage8-meta-templates.test.mjs
      - name: Check browser JavaScript syntax
        run: node --check staging-web/app.js
      - name: Verify staging API liveness (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          CODE=$(curl -sS --max-time 20 -o /tmp/fsp-health.json -w '%{http_code}' "$URL?route=%2Fhealthz")
          test "$CODE" = "200"
          grep -q '"messaging":"disabled"' /tmp/fsp-health.json
      - name: Verify approved dashboard CORS origin (no wildcard)
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          curl -sSI --max-time 20 -X OPTIONS -H 'Origin: https://futuresecureproviders.com' -H 'Access-Control-Request-Method: POST' "$URL?route=%2Fapi%2Fme" > /tmp/fsp-cors.txt
          grep -qi '^access-control-allow-origin: https://futuresecureproviders.com' /tmp/fsp-cors.txt
          if grep -q '^access-control-allow-origin: \*' /tmp/fsp-cors.txt; then exit 1; fi
      - name: Verify protected route rejects unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          CODE=$(curl -sS --max-time 20 -o /tmp/fsp-unauth.json -w '%{http_code}' "$URL?route=%2Fapi%2Fme")
          test "$CODE" = "401"
          grep -q '"error":"Authentication required"' /tmp/fsp-unauth.json
      - name: Verify global Inbox search cannot be queried without login
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          CODE=$(curl -sS --max-time 20 -o /tmp/fsp-search-denied.json -w '%{http_code}' "$URL?route=%2Fapi%2Fconversations&q=customer&filter=all&limit=5")
          test "$CODE" = "401"
          grep -q '"error":"Authentication required"' /tmp/fsp-search-denied.json
      - name: Verify Stage 6 operator coverage rejects anonymous requests
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          CODE=$(curl -sS --max-time 20 -o /tmp/fsp-stage6-coverage-noauth.json -w '%{http_code}' "$URL?route=%2Fapi%2Foperator-coverage")
          test "$CODE" = "401"
          grep -q '"error":"Authentication required"' /tmp/fsp-stage6-coverage-noauth.json
      - name: Verify template inventory rejects anonymous access
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          CODE=$(curl -sS --max-time 20 -o /tmp/fsp-noauth-templates.json -w '%{http_code}' "$URL?route=%2Fapi%2Ftemplates")
          test "$CODE" = "401"
          grep -q '"error":"Authentication required"' /tmp/fsp-noauth-templates.json
      - name: Verify Analytics rejects unauthenticated access
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          CODE=$(curl -sS --max-time 20 -o /tmp/fsp-analytics-noauth.json -w '%{http_code}' "$URL?route=%2Fapi%2Fanalytics%3Fdays%3D30")
          test "$CODE" = "401"
          grep -q '"error":"Authentication required"' /tmp/fsp-analytics-noauth.json
      - name: Verify contact mutations reject unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          CODE=$(curl -sS --max-time 20 -o /tmp/fsp-stage8-noauth.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"action":"create","wa_id":"919888777666"}' "$URL?route=%2Fapi%2Fcontacts")
          test "$CODE" = "401"
          grep -q '"error":"Authentication required"' /tmp/fsp-stage8-noauth.json
      - name: Verify Stage 7 privacy and incident checks reject unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          for ROUTE in retention-inventory incident-readiness; do
            CODE=$(curl -sS --max-time 20 -o /tmp/fsp-stage7-noauth.json -w '%{http_code}' "$URL?route=%2Fapi%2F$ROUTE")
            test "$CODE" = "401"
            grep -q '"error":"Authentication required"' /tmp/fsp-stage7-noauth.json
          done
      - name: Verify Stage 6 recovery diagnostics reject anonymous requests
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          CODE=$(curl -sS --max-time 20 -o /tmp/fsp-stage6-noauth.json -w '%{http_code}' "$URL?route=%2Fapi%2Frecovery-preflight")
          test "$CODE" = "401"
          grep -q '"error":"Authentication required"' /tmp/fsp-stage6-noauth.json
      - name: Verify production gate diagnostics reject anonymous requests
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          CODE=$(curl -sS --max-time 20 -o /tmp/fsp-stage5-noauth.json -w '%{http_code}' "$URL?route=%2Fapi%2Fproduction-gates")
          test "$CODE" = "401"
          grep -q '"error":"Authentication required"' /tmp/fsp-stage5-noauth.json
      - name: Verify operational alerts require authentication
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          CODE=$(curl -sS --max-time 20 -o /tmp/fsp-stage4-noauth.json -w '%{http_code}' "$URL?route=%2Fapi%2Foperational-alerts")
          test "$CODE" = "401"
          grep -q '"error":"Authentication required"' /tmp/fsp-stage4-noauth.json
      - name: Verify reply operations monitoring requires authentication
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          CODE=$(curl -sS --max-time 20 -o /tmp/fsp-noauth-ops.json -w '%{http_code}' "$URL?route=%2Fapi%2Freply-operations")
          test "$CODE" = "401"
          grep -q '"error":"Authentication required"' /tmp/fsp-noauth-ops.json
      - name: Verify Meta connection check rejects unauthenticated calls
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          CODE=$(curl -sS --max-time 20 -o /tmp/fsp-no-auth-meta.json -w '%{http_code}' "$URL?route=%2Fapi%2Fmeta%2Fconnection-check")
          test "$CODE" = "401"
          grep -q '"error":"Authentication required"' /tmp/fsp-no-auth-meta.json
      - name: Verify auto-mark route rejects unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vzcpzhobtfwhurcsppdl.supabase.co/functions/v1/fsp-connect-staging-api"
          CODE=$(curl -sS --max-time 20 -o /tmp/fsp-no-auth-auto-read.json -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"action":"auto_mark_read","observed_last_message_at":"2026-10-29T13:55:00Z","observed_unread_count":1}' "$URL?route=%2Fapi%2Fconversations%2Faaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa%2Factions")
          test "$CODE" = "401"
          grep -q '"error":"Authentication required"' /tmp/fsp-no-auth-auto-read.json
