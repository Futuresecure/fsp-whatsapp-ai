<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FSP WhatsApp AI — Preview</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#18303a;background:#f3f7f8}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#062d2c;color:#eaf9f7;padding:25px 15px}.brand{font-weight:800;font-size:19px;padding:8px 12px 30px;letter-spacing:.5px}.brand small{display:block;font-size:10px;letter-spacing:3px;color:#6ee7d2;margin-top:6px}.nav{width:100%;border:0;background:transparent;color:#d4e5e2;text-align:left;padding:14px;border-radius:10px;margin:3px 0}.nav.active,.nav:hover{background:#12625b;color:white}.main{min-width:0}.top{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;background:white;border-bottom:1px solid #e3ebed;gap:10px}.top h1{font-size:22px;margin:0}.sub{color:#6b828b;font-size:13px}.content{padding:26px;max-width:1600px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}.card,.panel{background:white;border:1px solid #e1eaed;border-radius:15px;box-shadow:0 4px 14px #153d3910}.card{padding:20px}.card strong{display:block;font-size:29px;margin-top:10px}.card span{font-size:13px;color:#607782}.grid{display:grid;grid-template-columns:300px minmax(0,1fr) 255px;gap:15px;height:590px}.panel{min-width:0;overflow:hidden}.panelhead{padding:18px;border-bottom:1px solid #e7eff0;font-weight:750}.search{margin:12px;width:calc(100% - 24px);padding:11px;border:1px solid #dce6e9;border-radius:9px}.person{display:block;width:100%;border:0;border-bottom:1px solid #eff3f3;background:white;text-align:left;padding:15px}.person.selected{background:#e6f7f2;border-left:4px solid #009a7c}.person b{display:block}.person small{color:#69808a}.chat{display:flex;flex-direction:column;height:100%}.messages{flex:1;overflow:auto;background:#f7faf9;padding:18px}.bubble{max-width:82%;background:white;padding:12px 14px;border-radius:13px;margin-bottom:13px;line-height:1.5;box-shadow:0 2px 7px #102d2910}.bubble.out{margin-left:auto;background:#d9f9e9}.bubble small{display:block;text-align:right;color:#71878b;font-size:10px;margin-top:6px}.composer{padding:12px;display:flex;gap:8px;border-top:1px solid #e5ecee}.composer input{flex:1;min-width:0;padding:12px;border:1px solid #dce6e9;border-radius:9px}.primary{background:#008b72;color:white;border:0;padding:11px 15px;border-radius:9px}.details{padding:18px}.details p{font-size:13px;line-height:1.8;border-bottom:1px solid #edf2f2;padding-bottom:9px}.details span{color:#71858c}.badge{display:inline-block;padding:5px 9px;background:#dff7e9;color:#087450;border-radius:8px;font-size:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.automation{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.auto{padding:22px}.auto label{display:flex;align-items:center;justify-content:space-between;gap:10px}.auto p{color:#6b8189;font-size:13px}.auto input{width:20px;height:20px;accent-color:#008b72}.notice{padding:12px 16px;background:#fff7e4;color:#7a581b;border:1px solid #f0d9a1;border-radius:10px;margin-bottom:18px;font-size:13px}.hide{display:none}.empty{padding:22px;color:#71858c}.mobilemenu{display:none}@media(max-width:1150px){.grid{grid-template-columns:280px minmax(0,1fr)}.detailpanel{display:none}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:750px){.app{display:block}.side{display:flex;overflow:auto;gap:6px;padding:10px}.brand{display:none}.nav{white-space:nowrap;width:auto;margin:0;padding:10px}.top{padding:16px}.top h1{font-size:18px}.content{padding:13px}.cards{gap:8px}.card{padding:12px}.card strong{font-size:23px}.grid{display:flex;flex-direction:column;height:auto}.listpanel{height:230px;overflow:auto}.chatpanel{height:490px}.automation{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">FUTURE SECURE<small>PROVIDERS</small></div><nav id="nav"></nav></aside><main class="main"><header class="top"><div><h1 id="heading">Dashboard</h1><div class="sub">WhatsApp AI System · Standalone UI preview</div></div><span class="badge">● Demo Mode</span></header><div class="content"><div class="notice">UI preview with fictional sample data. No live WhatsApp, Supabase, AI, or message sending connection.</div><section id="dashboard"><div class="cards" id="cards"></div><div class="grid" id="workspace"></div></section><section id="other" class="hide"></section></div></main></div>
<script>
const people=[{name:'Ramesh Kumar',phone:'+91 90000 00001',text:'5 lakh policy premium எவ்வளவு?',status:'New Enquiry',lang:'Tamil',msgs:[['in','வணக்கம்'],['in','5 lakh policy premium எவ்வளவு?'],['out','வணக்கம்! Premium விவரம் அறிய உங்கள் வயது மற்றும் குடும்ப உறுப்பினர்களின் விவரங்களைச் சொல்லுங்கள்.']]},{name:'Priya S',phone:'+91 90000 00002',text:'Maternity cover details please',status:'Women Care',lang:'English',msgs:[['in','Maternity cover details please']]},{name:'Karthik V',phone:'+91 90000 00003',text:'Cashless hospital list share pannunga',status:'Information',lang:'Tanglish',msgs:[['in','Cashless hospital list share pannunga']]},{name:'Meena R',phone:'+91 90000 00004',text:'Family floater 10L premium',status:'Quote Request',lang:'English',msgs:[['in','Family floater 10L premium']]}];
const modules=['Dashboard','Inbox','Contacts','AI Agent','Automation','Broadcast','Templates','Reports','Settings'];let active='Dashboard',selected=0;const settings=['AI Auto Reply','Welcome Message','Lead Qualification','Follow-up Reminder','Appointment Reminder','Scheduled Broadcast','Human Handoff','Opt-out Detection'];let flags=[true,true,true,false,false,false,true,true];
function renderNav(){document.getElementById('nav').innerHTML=modules.map(m=>'<button class="nav '+(active===m?'active':'')+'" data-nav="'+m+'">'+({Dashboard:'▦',Inbox:'▤',Contacts:'♙','AI Agent':'✦',Automation:'⚙',Broadcast:'◈',Templates:'▧',Reports:'▥',Settings:'☷'}[m])+' &nbsp; '+m+'</button>').join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{active=b.dataset.nav;render()})}
function render(){renderNav();document.getElementById('heading').textContent=active;let dash=['Dashboard','Inbox'].includes(active);document.getElementById('dashboard').classList.toggle('hide',!dash);document.getElementById('other').classList.toggle('hide',dash);if(dash){document.getElementById('cards').innerHTML=[['Total Contacts','4'],['Conversations','4'],['AI Replies','1'],['Pending Chats','3']].map(([a,b])=>'<div class="card"><span>'+a+'</span><strong>'+b+'</strong><span>Demo data</span></div>').join('');renderWorkspace()}else renderOther()}
function renderWorkspace(){document.getElementById('workspace').innerHTML='<div class="panel listpanel"><div class="panelhead">Conversations</div><input class="search" id="filter" placeholder="Search conversations..."><div id="people"></div></div><div class="panel chatpanel"><div class="chat"><div class="panelhead" id="chathead"></div><div class="messages" id="messages"></div><form class="composer" id="composer"><input id="draft" placeholder="Type a demo message..." required><button class="primary">Add to demo</button></form></div></div><div class="panel detailpanel"><div class="panelhead">Contact Details</div><div class="details" id="details"></div></div>';document.getElementById('filter').oninput=renderPeople;document.getElementById('composer').onsubmit=e=>{e.preventDefault();let v=document.getElementById('draft').value.trim();if(v){people[selected].msgs.push(['out',v]);renderChat()}};renderPeople();renderChat()}
function renderPeople(){let q=document.getElementById('filter').value.toLowerCase();document.getElementById('people').innerHTML=people.map((p,i)=>p.name.toLowerCase().includes(q)||p.text.toLowerCase().includes(q)?'<button class="person '+(selected===i?'selected':'')+'" data-i="'+i+'"><b>'+escapeHTML(p.name)+'</b><small>'+escapeHTML(p.text)+'</small></button>':'').join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.i);renderPeople();renderChat()})}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderChat(){let p=people[selected];document.getElementById('chathead').textContent=p.name+' · '+p.phone;document.getElementById('messages').innerHTML=p.msgs.map(([d,t])=>'<div class="bubble '+(d==='out'?'out':'')+'">'+escapeHTML(t)+'<small>'+ (d==='out'?'Demo agent':'Demo contact')+'</small></div>').join('');document.getElementById('details').innerHTML='<h3>'+escapeHTML(p.name)+'</h3><p><span>Phone</span><br>'+escapeHTML(p.phone)+'</p><p><span>Language</span><br>'+escapeHTML(p.lang)+'</p><p><span>Status</span><br><span class="badge">'+escapeHTML(p.status)+'</span></p><p><span>Source</span><br>Demo</p>';document.getElementById('draft').value='';document.getElementById('messages').scrollTop=99999}
function renderOther(){let el=document.getElementById('other');if(active==='Automation'||active==='AI Agent'){el.innerHTML='<div class="toolbar"><h2>Automation Control Center</h2><span class="badge">Preview only</span></div><div class="automation">'+settings.map((s,i)=>'<div class="panel auto"><label><strong>'+s+'</strong><input type="checkbox" data-flag="'+i+'" '+(flags[i]?'checked':'')+'></label><p>Demo configuration. No real automated actions are triggered.</p></div>').join('')+'</div>';document.querySelectorAll('[data-flag]').forEach(x=>x.onchange=()=>{flags[Number(x.dataset.flag)]=x.checked})}else if(active==='Contacts'){el.innerHTML='<div class="panel"><div class="panelhead">Contacts · Demo</div>'+people.map(p=>'<div class="person"><b>'+escapeHTML(p.name)+'</b><small>'+escapeHTML(p.phone)+' · '+escapeHTML(p.status)+'</small></div>').join('')+'</div>'}else{el.innerHTML='<div class="panel"><div class="panelhead">'+active+'</div><div class="empty">Module shell ready for development. Live functionality is not connected.</div></div>'}}
render();
</script></body></html>
